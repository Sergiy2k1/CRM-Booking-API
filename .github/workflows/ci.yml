name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore BookingHub.sln

      - name: Build
        run: dotnet build BookingHub.sln --configuration Release --no-restore

      - name: Domain tests
        run: dotnet test tests/BookingHub.Domain.UnitTests --configuration Release --no-build

      - name: Application tests
        run: dotnet test tests/BookingHub.Application.UnitTests --configuration Release --no-build

      - name: Infrastructure integration tests
        run: dotnet test tests/BookingHub.Infrastructure.IntegrationTests --configuration Release --no-build

      - name: API integration tests
        run: dotnet test tests/BookingHub.Api.IntegrationTests --configuration Release --no-build

      - name: Architecture tests
        run: dotnet test tests/BookingHub.ArchitectureTests --configuration Release --no-build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Build API image
        run: docker build --file src/BookingHub.Api/Dockerfile --tag bookinghub-api:ci .

      - name: Build Worker image
        run: docker build --file src/BookingHub.Worker/Dockerfile --tag bookinghub-worker:ci .
