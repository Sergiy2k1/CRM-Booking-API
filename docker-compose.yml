services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookinghub
      POSTGRES_USER: bookinghub
      POSTGRES_PASSWORD: bookinghub
    ports:
      - "5432:5432"
    volumes:
      - bookinghub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinghub -d bookinghub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bookinghub
      RABBITMQ_DEFAULT_PASS: bookinghub
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - bookinghub-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/BookingHub.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=bookinghub;Username=bookinghub;Password=bookinghub;GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: bookinghub
      RabbitMq__Password: bookinghub
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: bookinghub.events
      RabbitMq__Queue: bookinghub.realtime
      RabbitMq__BindingKey: booking.#
      RabbitMq__ReconnectSeconds: "5"
      Jwt__Issuer: BookingHub
      Jwt__Audience: BookingHub.Api
      Jwt__SigningKey: development-only-signing-key-change-before-production-2026
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      ExportStorage__RootPath: /data/exports
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - bookinghub-exports:/data/exports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/BookingHub.Worker/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=bookinghub;Username=bookinghub;Password=bookinghub;GSS Encryption Mode=Disable
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: bookinghub
      RabbitMq__Password: bookinghub
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: bookinghub.events
      RabbitMq__NotificationQueue: bookinghub.notifications
      RabbitMq__NotificationBindingKey: booking.#
      RabbitMq__ReconnectSeconds: "5"
      Outbox__BatchSize: "50"
      Outbox__PollIntervalSeconds: "2"
      Outbox__MaxAttempts: "10"
      ExportStorage__RootPath: /data/exports
      BookingExports__PollIntervalSeconds: "2"
      BookingExports__MaxAttempts: "3"
      BookingExports__ClaimTimeoutMinutes: "5"
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - bookinghub-exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.2
    command:
      - -config.file=/etc/tempo.yml
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - bookinghub-tempo:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "9464:9464"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - bookinghub-prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bookinghub-grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

volumes:
  bookinghub-postgres:
  bookinghub-rabbitmq:
  bookinghub-exports:
  bookinghub-tempo:
  bookinghub-prometheus:
  bookinghub-grafana:
